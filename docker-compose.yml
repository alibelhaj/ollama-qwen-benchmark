# Démarrage complet : docker compose up -d ollama && docker compose run --rm app demo.py
services:
  # Moteur d'inférence. Les modèles sont gardés dans un volume : un seul téléchargement.
  ollama:
    image: ollama/ollama:0.6.6
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m      # garde le modèle chargé (évite le démarrage à froid)
      OLLAMA_NUM_PARALLEL: 1      # une requête à la fois : latence minimale, moins de mémoire
    # ports: ["11435:11434"]      # décommenter pour appeler l'API depuis l'hôte
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Tâche unique : télécharge le modèle s'il n'est pas déjà dans le volume.
  model-pull:
    image: ollama/ollama:0.6.6
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${MODEL:-qwen2.5:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Application Python : démo, benchmark, tests de diagnostic.
  app:
    build: .
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${MODEL:-qwen2.5:1.5b}
      NUM_THREAD: ${NUM_THREAD:-}
    volumes:
      - ./results:/app/results
    depends_on:
      model-pull:
        condition: service_completed_successfully
    stdin_open: true
    tty: true

volumes:
  ollama-models:
